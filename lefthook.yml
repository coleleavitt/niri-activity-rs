# Local quality gates. Install with: lefthook install
#
# pre-commit stays relatively fast. pre-push mirrors the warning and test gates
# from .github/workflows/ci.yml. Every command runs on the default toolchain —
# this machine develops against `rustc-master`, and pinning a gate to a channel
# that is not installed locally turns the hook into a rustup error instead of a
# check. CI still runs the same gates on stable.
pre-commit:
  commands:
    format:
      run: cargo fmt --all -- --check
      fail_text: "Rust formatting failed. Run: cargo fmt --all"
    check:
      run: cargo check --locked --workspace --all-targets --all-features
      fail_text: "Locked workspace check failed."

pre-push:
  commands:
    clippy:
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      fail_text: "Clippy failed."
    test:
      run: cargo test --locked --workspace --all-targets --all-features
      fail_text: "Workspace tests failed."
