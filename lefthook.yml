# Local quality gates. Install with: lefthook install
#
# pre-commit stays relatively fast. pre-push mirrors the warning and test gates
# from .github/workflows/ci.yml using the stable toolchain explicitly, so a
# different local default toolchain cannot hide CI-only Clippy diagnostics.
pre-commit:
  commands:
    format:
      run: cargo fmt --all -- --check
      fail_text: "Rust formatting failed. Run: cargo fmt --all"
    check:
      run: cargo check --locked --workspace --all-targets --all-features
      fail_text: "Locked workspace check failed."

pre-push:
  commands:
    clippy:
      run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      fail_text: "Stable-toolchain Clippy failed."
    test:
      run: cargo +stable test --locked --workspace --all-targets --all-features
      fail_text: "Stable-toolchain workspace tests failed."
