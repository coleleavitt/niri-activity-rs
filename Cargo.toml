[package]
name = "niri-activity-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
niri-ipc = { path = "../niri/niri-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.39.0", features = ["bundled"] }
clap = { version = "4.6.0", features = ["derive"] }
directories = "6.0.0"
thiserror = "2"
toml = "1.1.2"
evdev = "0.13"
input = { version = "0.9", features = ["libinput_1_21"] }
libc = "0.2"
signal-hook = "0.4.3"
backoff = "0.4"
inotify = { version = "0.11.1", default-features = false }
owo-colors = "4.3.0"
ratatui = { version = "0.30.0", features = ["crossterm"] }
crossterm = "0.29"
regex = "1.12.3"
logind-zbus = "5.3"
zbus = { version = "5.14.0", default-features = false, features = ["blocking-api"] }
rust_xlsxwriter = { git = "https://github.com/coleleavitt/rust_xlsxwriter.git", rev = "1970a524c01b54b5cf7d194d8e970f540f3457ad" }
lettre = "0.11.20"
tempfile = "3.27.0"

[features]
default = []
excel-extra-sheets = []  # Enables Weekly Summary and App Breakdown sheets in Excel export

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }

# Specific additional warnings
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Allow noisy pedantic/nursery lints
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
items_after_statements = "allow"
cognitive_complexity = "allow"
needless_pass_by_value = "allow"
use_self = "allow"
manual_let_else = "allow"
print_stdout = "allow"
print_stderr = "allow"
unwrap_used = "allow"
future_not_send = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
