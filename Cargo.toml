[package]
name = "niri-activity-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
niri-ipc = { path = "../niri/niri-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
thiserror = "2"
toml = "1.0.3+spec-1.1.0"
evdev = "0.13"
signal-hook = "0.4.3"
backoff = "0.4"
inotify = { version = "0.11", default-features = false }
owo-colors = "4.2.3"
ratatui = "0.30.0"
crossterm = "0.28"
regex = "1.12.3"
logind-zbus = "5.3"
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
rust_xlsxwriter = "0.93.0"
lettre = "0.11"
tempfile = "3"
