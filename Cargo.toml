[package]
name = "actitivty-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
niri-ipc = { path = "../niri/niri-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
thiserror = "2"
toml = "0.8"
evdev = "0.13"
